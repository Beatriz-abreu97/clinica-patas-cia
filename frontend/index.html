<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf9" id="meta-theme-color" />
    <meta
      name="description"
      content="Clínica Veterinária Patas &amp; Cia — Recepção e cadastro de tutores e pacientes animais."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem("patas-cia-tema");
          var prefereEscuro =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var escuro = salvo === "dark" || (salvo !== "light" && prefereEscuro);
          if (escuro) {
            document.documentElement.classList.add("dark");
            var meta = document.getElementById("meta-theme-color");
            if (meta) meta.setAttribute("content", "#171412");
          }
        } catch (e) {}
      })();
    </script>
    <title>Clínica Patas &amp; Cia — Recepção Veterinária</title>
  </head>
  <body class="bg-canvas text-stone-800 dark:text-stone-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
